name: paperwise
description: Paperwise is a private, fully offline PDF toolkit by Lumio Apps.
publish_to: "none"
version: 1.9.0+29

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  file_picker: ^13.1.0
  google_mlkit_text_recognition: ">=0.15.0 <1.0.0"
  http: ">=1.2.0 <2.0.0"
  image: ">=4.5.0 <5.0.0"
  image_picker: ^1.2.4
  open_filex: ">=4.5.0 <5.0.0"
  package_info_plus: ">=8.0.0 <11.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  pdf: ^3.13.1
  pdfrx: ^2.6.5
  pointycastle: ">=3.9.1 <5.0.0"
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0 <7.0.0"
  flutter_launcher_icons: ">=0.14.0 <0.15.0"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - assets/fonts/OFL.txt

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
