name: Release

# Runs when you push a tag like v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      # Sign the APK with the Lumio release key from repository secrets.
      # Required secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "Paperwise-${{ github.ref_name }}.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "Paperwise-${{ github.ref_name }}.apk"
          rm release.jks

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Paperwise-${{ github.ref_name }}.apk
          generate_release_notes: true

  # Windows desktop build. Runs after the Android job so the release already exists.
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Windows runner project is generated here, so the repo stays small.
      - name: Create Windows project files
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org com.lumioapps --project-name paperwise .
          fi

      - run: flutter pub get

      - name: Make Windows icon
        shell: bash
        run: dart run flutter_launcher_icons

      - name: Set window title
        shell: bash
        run: |
          sed -i 's/L"paperwise"/L"Paperwise"/' windows/runner/main.cpp || true

      - name: Build Windows app
        run: flutter build windows --release

      - name: Zip the app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Paperwise-${{ github.ref_name }}-windows.zip"

      - name: Add zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: Paperwise-${{ github.ref_name }}-windows.zip
