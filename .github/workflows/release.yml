name: Release

# Runs when you push a tag like v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # The release key comes from repository secrets and is written to a file
      # that Gradle reads (android/key.properties). Both the APK and the Play Store
      # bundle are signed by Gradle with this key.
      # Required secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Set up the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store bundle (AAB)
        run: flutter build appbundle --release

      - name: Check signatures
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab

      # Only prints a report. Google Play wants native libraries aligned to 16 KB pages.
      - name: Check 16 KB page alignment (report only)
        continue-on-error: true
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk | grep -i "\.so\|Verification" || true
          mkdir -p libcheck && cd libcheck
          unzip -q -o ../build/app/outputs/flutter-apk/app-release.apk 'lib/arm64-v8a/*.so'
          for f in lib/arm64-v8a/*.so; do
            align=$(readelf -lW "$f" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')
            echo "$f  LOAD align: $align"
          done

      - name: Collect files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "Paperwise-${{ github.ref_name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "Paperwise-${{ github.ref_name }}.aab"
          rm -f android/app/release.jks android/key.properties

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Paperwise-${{ github.ref_name }}.apk
            Paperwise-${{ github.ref_name }}.aab
          generate_release_notes: true
